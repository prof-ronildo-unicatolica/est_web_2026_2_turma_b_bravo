name: CI - StayFlow Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/services/core-service

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx fastapi pydantic sqlalchemy
          if [ -f pyproject.toml ]; then pip install poetry && poetry config virtualenvs.create false && poetry install --no-interaction || true; fi

      - name: Executar Lint com Ruff
        run: |
          ruff check app/ tests/ --ignore E501 || true

      - name: Executar Testes com Pytest
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-stayflow-super-secure"
          ALGORITHM: "HS256"
          ENVIRONMENT: "test"
        run: |
          pytest tests/ -v || true

  frontend-checks:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar Build de Produção
        run: npm run build
