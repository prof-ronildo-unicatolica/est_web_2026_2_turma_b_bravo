# ============================================================
# Pipeline de CI/CD — StayFlow (Equipe Bravo)
# Sprint 7 | Tarefa 7.1 — Raul de Queiroz Moura
# ============================================================
# Dispara em:
#   - Pull Requests com destino à branch develop
#   - Push direto na branch develop (para validação pós-merge)
# ============================================================

name: CI — Lint, Testes e Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  # ----------------------------------------------------------
  # JOB 1 — Lint do Backend (Ruff) + Testes (Pytest)
  # ----------------------------------------------------------
  backend-ci:
    name: 🐍 Backend — Ruff Lint & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/services/core-service

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: apps/services/core-service/requirements.txt

      - name: 📦 Instalar dependências do backend
        run: pip install -r requirements.txt

      - name: 🔍 Executar linter Ruff
        run: |
          echo "==> Verificando código com Ruff..."
          ruff check . --config ruff.toml

      - name: ✅ Executar testes com Pytest
        env:
          # Variáveis de ambiente necessárias para a aplicação inicializar
          # O conftest.py já usa SQLite in-memory para isolamento dos testes
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "ci-test-secret-key-nao-usar-em-producao"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          MONGODB_URL: "mongodb://localhost:27017"
          RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
        run: |
          echo "==> Executando suíte de testes..."
          pytest tests/ -v --tb=short

  # ----------------------------------------------------------
  # JOB 2 — Build do Frontend (Vite)
  # ----------------------------------------------------------
  frontend-ci:
    name: ⚛️ Frontend — ESLint & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: 📦 Instalar dependências do frontend
        run: npm ci

      - name: 🔍 Executar ESLint
        run: |
          echo "==> Verificando código com ESLint..."
          npm run lint

      - name: 🏗️ Executar build de produção (Vite)
        run: |
          echo "==> Gerando build de produção..."
          npm run build

      - name: 📤 Upload dos artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          retention-days: 7

  # ----------------------------------------------------------
  # JOB 3 — Sumário de Qualidade (executa após os dois Jobs)
  # ----------------------------------------------------------
  quality-gate:
    name: 🏁 Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()

    steps:
      - name: ✅ Verificar resultado dos jobs
        run: |
          echo "============================================"
          echo " StayFlow — Relatório de Qualidade CI/CD"
          echo "============================================"
          if [ "${{ needs.backend-ci.result }}" == "success" ] && \
             [ "${{ needs.frontend-ci.result }}" == "success" ]; then
            echo "✅ Backend CI:  APROVADO"
            echo "✅ Frontend CI: APROVADO"
            echo "--------------------------------------------"
            echo "🎉 Quality Gate PASSOU — PR pronto para revisão!"
            exit 0
          else
            echo "❌ Backend CI:  ${{ needs.backend-ci.result }}"
            echo "❌ Frontend CI: ${{ needs.frontend-ci.result }}"
            echo "--------------------------------------------"
            echo "🚫 Quality Gate FALHOU — corrija os erros antes do merge."
            exit 1
          fi
